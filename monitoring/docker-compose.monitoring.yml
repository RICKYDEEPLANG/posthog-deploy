version: '3.8'

services:
  # Prometheus - 时序数据库
  prometheus:
    image: prom/prometheus:latest
    container_name: posthog-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus/rules:/etc/prometheus/rules
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    networks:
      - posthog_default

  # Grafana - 可视化
  grafana:
    image: grafana/grafana:latest
    container_name: posthog-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    networks:
      - posthog_default
    depends_on:
      - prometheus

  # cAdvisor - 容器监控
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: posthog-cadvisor
    restart: unless-stopped
    ports:
      - "8081:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    privileged: true
    networks:
      - posthog_default

  # Node Exporter - 系统监控
  node-exporter:
    image: prom/node-exporter:latest
    container_name: posthog-node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - posthog_default

  # Kafka Exporter - Kafka 监控
  kafka-exporter:
    image: danielqsj/kafka-exporter:latest
    container_name: posthog-kafka-exporter
    restart: unless-stopped
    ports:
      - "9308:9308"
    command:
      - '--kafka.server=posthog-kafka-1:9092'
    networks:
      - posthog_default

  # ClickHouse Exporter - ClickHouse 监控
  clickhouse-exporter:
    image: clickhouse/clickhouse-server:latest
    container_name: posthog-clickhouse-exporter
    restart: unless-stopped
    ports:
      - "9363:9363"
    entrypoint: /bin/sh
    command:
      - -c
      - |
        cat > /tmp/exporter.sh << 'EOF'
        #!/bin/sh
        while true; do
          echo "# HELP clickhouse_up ClickHouse is up"
          echo "# TYPE clickhouse_up gauge"
          if clickhouse-client --host posthog-clickhouse-1 --query "SELECT 1" > /dev/null 2>&1; then
            echo "clickhouse_up 1"
          else
            echo "clickhouse_up 0"
          fi
          sleep 15
        done
        EOF
        chmod +x /tmp/exporter.sh
        /tmp/exporter.sh
    networks:
      - posthog_default

volumes:
  prometheus-data:
  grafana-data:

networks:
  posthog_default:
    external: true
