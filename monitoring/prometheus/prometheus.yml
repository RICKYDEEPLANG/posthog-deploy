global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'posthog'
    environment: 'production'

# 告警规则文件
rule_files:
  - '/etc/prometheus/rules/*.yml'

# 抓取配置
scrape_configs:
  # Prometheus 自身监控
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # 系统监控 (Node Exporter)
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']

  # 容器监控 (cAdvisor)
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  # Kafka 监控
  - job_name: 'kafka'
    static_configs:
      - targets: ['kafka-exporter:9308']

  # ClickHouse 监控
  - job_name: 'clickhouse'
    static_configs:
      - targets: ['posthog-clickhouse-1:9363']
    metrics_path: '/metrics'

  # PostHog 容器监控（通过 cAdvisor）
  - job_name: 'posthog-containers'
    static_configs:
      - targets: ['cadvisor:8080']
    metric_relabel_configs:
      # 只保留 posthog 相关容器
      - source_labels: [name]
        regex: '.*posthog.*'
        action: keep
