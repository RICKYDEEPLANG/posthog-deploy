global:
  scrape_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - 'alerts.yml'

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'containers'
    static_configs:
      - targets: ['host.docker.internal:8082']

  - job_name: 'kafka'
    static_configs:
      - targets: ['posthog-kafka-exporter:9308']

  - job_name: 'system'
    static_configs:
      - targets: ['host.docker.internal:9100']

  - job_name: 'clickhouse'
    static_configs:
      - targets: ['posthog-clickhouse-exporter:9116']

  - job_name: 'caddy'
    static_configs:
      - targets: ['proxy:2019']

  - job_name: 'capture'
    static_configs:
      - targets: ['posthog-capture-1:3000', 'posthog-capture-2:3000']
    metrics_path: '/metrics'
