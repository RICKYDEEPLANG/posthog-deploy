services:
  prometheus:
    image: uhub.service.ucloud.cn/deeplang/prometheus:latest
    container_name: posthog-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=7d'
    network_mode: host

  grafana:
    image: uhub.service.ucloud.cn/xinxin-test/grafana:latest
    container_name: posthog-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin123
    volumes:
      - grafana-data:/var/lib/grafana
    network_mode: host

  cadvisor:
    image: uhub.service.ucloud.cn/deeplang/google/cadvisor:latest
    container_name: posthog-cadvisor
    restart: unless-stopped
    ports:
      - "8082:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    privileged: true
    network_mode: host

  kafka-exporter:
    image: uhub.service.ucloud.cn/deeplang/danielqsj/kafka-exporter:latest
    container_name: posthog-kafka-exporter
    restart: unless-stopped
    ports:
      - "9308:9308"
    command:
      - '--kafka.server=localhost:9092'
    network_mode: host

  node-exporter:
    image: uhub.service.ucloud.cn/deeplang/prom/node-exporter:latest
    container_name: posthog-node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    network_mode: host

  clickhouse-exporter:
    image: uhub.service.ucloud.cn/deeplang/f1yegor/clickhouse-exporter:latest
    container_name: posthog-clickhouse-exporter
    restart: unless-stopped
    ports:
      - "9116:9116"
    command:
      - '-scrape_uri=http://localhost:8123/'
    network_mode: host

volumes:
  prometheus-data:
  grafana-data:
