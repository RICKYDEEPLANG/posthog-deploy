#
# `docker-compose` file used ONLY for hobby deployments.
#
# Please take a look at https://posthog.com/docs/self-host/deploy/hobby
# for more info.
#
# PostHog has sunset support for self-hosted K8s deployments.
# See: https://posthog.com/blog/sunsetting-helm-support-posthog
#

services:
    db:
        extends:
            file: docker-compose.base.yml
            service: db
        image: ${DOCKER_REGISTRY_PREFIX:-}postgres:15.12-alpine
        volumes:
            - postgres-data:/var/lib/postgresql/data

    redis:
        extends:
            file: docker-compose.base.yml
            service: redis
        volumes:
            - redis-data:/data

    redis7:
        extends:
            file: docker-compose.base.yml
            service: redis7
        volumes:
            - redis7-data:/data

    clickhouse:
        #
        # Note: please keep the default version in sync across
        #       `posthog` and the `charts-clickhouse` repos
        #
        extends:
            file: docker-compose.base.yml
            service: clickhouse
        restart: on-failure
        depends_on:
            - kafka
            - zookeeper
        volumes:
            - ./posthog/posthog/idl:/idl
            - ./posthog/docker/clickhouse/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d
            - ./posthog/docker/clickhouse/config.xml:/etc/clickhouse-server/config.xml
            - ./posthog/docker/clickhouse/config.d/default.xml:/etc/clickhouse-server/config.d/default.xml
            - ./posthog/docker/clickhouse/users.xml:/etc/clickhouse-server/users.xml
            - ./posthog/docker/clickhouse/user_defined_function.xml:/etc/clickhouse-server/user_defined_function.xml
            - ./posthog/posthog/user_scripts:/var/lib/clickhouse/user_scripts
            - clickhouse-data:/var/lib/clickhouse

    zookeeper:
        extends:
            file: docker-compose.base.yml
            service: zookeeper
        volumes:
            - zookeeper-datalog:/datalog
            - zookeeper-data:/data
            - zookeeper-logs:/logs
    kafka:
        extends:
            file: docker-compose.base.yml
            service: kafka
        depends_on:
            - zookeeper
        environment:
            KAFKA_LOG_RETENTION_MS: 3600000
            KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 300000
            KAFKA_LOG_RETENTION_HOURS: 1
        volumes:
            - kafka-data:/bitnami/kafka

    worker:
        extends:
            file: docker-compose.base.yml
            service: worker
        volumes: []
            # - ./posthog:/code  # 注释：源码挂载可能与官方镜像版本不兼容
        deploy:
            resources:
                limits:
                    memory: 100G
        environment:
            WEB_CONCURRENCY: 4
            SITE_URL: https://$DOMAIN
            SECRET_KEY: $POSTHOG_SECRET
            OBJECT_STORAGE_ACCESS_KEY_ID: 'object_storage_root_user'
            OBJECT_STORAGE_SECRET_ACCESS_KEY: 'object_storage_root_password'
            OBJECT_STORAGE_ENDPOINT: http://objectstorage:19000
            SESSION_RECORDING_V2_S3_ENDPOINT: http://seaweedfs:8333
            SESSION_RECORDING_V2_S3_ACCESS_KEY_ID: 'any'
            SESSION_RECORDING_V2_S3_SECRET_ACCESS_KEY: 'any'
            OBJECT_STORAGE_ENABLED: true
            ENCRYPTION_SALT_KEYS: $ENCRYPTION_SALT_KEYS
            POSTHOG_SKIP_MIGRATION_CHECKS: '1'
            TEMPORAL_HOST: temporal
            TEMPORAL_PORT: 7233
            TEMPORAL_NAMESPACE: default
            CLICKHOUSE_HOST: clickhouse
            CLICKHOUSE_PORT: 9000
            CLICKHOUSE_DATABASE: posthog
            CLICKHOUSE_USER: default
            CLICKHOUSE_PASSWORD: ""
            CLICKHOUSE_SECURE: "false"
            CLICKHOUSE_VERIFY: "false"
            EMAIL_HOST: ${EMAIL_HOST}
            EMAIL_PORT: ${EMAIL_PORT}
            EMAIL_HOST_USER: ${EMAIL_HOST_USER}
            EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD}
            EMAIL_USE_SSL: ${EMAIL_USE_SSL}
            EMAIL_USE_TLS: ${EMAIL_USE_TLS}
            DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL}
            EMAIL_ENABLED: ${EMAIL_ENABLED}
        image: $REGISTRY_URL:$POSTHOG_APP_TAG
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_healthy
            clickhouse:
                condition: service_started
            kafka:
                condition: service_healthy
            web:
                condition: service_started
            temporal:
                condition: service_started
    web:
        extends:
            file: docker-compose.base.yml
            service: web
        command: /compose/start
        volumes:
            - ./compose:/compose
            # - ./posthog/posthog/api/user.py:/code/posthog/api/user.py  # 注释：禁用密码修改功能（需适配新版本）
            # - ./posthog/posthog/api/authentication.py:/code/posthog/api/authentication.py  # 注释：禁用密码重置功能（需适配新版本）
        image: $REGISTRY_URL:$POSTHOG_APP_TAG
        deploy:
            resources:
                limits:
                    memory: 80G
                    cpus: '12'
                reservations:
                    memory: 8G
                    cpus: '4'
        environment:
            SITE_URL: https://$DOMAIN
            LIVESTREAM_HOST: 'https://${DOMAIN}/livestream'
            SECRET_KEY: $POSTHOG_SECRET
            OBJECT_STORAGE_ACCESS_KEY_ID: 'object_storage_root_user'
            OBJECT_STORAGE_SECRET_ACCESS_KEY: 'object_storage_root_password'
            SESSION_RECORDING_V2_S3_ACCESS_KEY_ID: 'any'
            SESSION_RECORDING_V2_S3_SECRET_ACCESS_KEY: 'any'
            OBJECT_STORAGE_ENDPOINT: http://objectstorage:19000
            SESSION_RECORDING_V2_S3_ENDPOINT: http://seaweedfs:8333
            OBJECT_STORAGE_ENABLED: true
            ENCRYPTION_SALT_KEYS: $ENCRYPTION_SALT_KEYS
            OTEL_SERVICE_NAME: 'posthog'
            OTEL_EXPORTER_OTLP_ENDPOINT: ''
            OTEL_SDK_DISABLED: 'true'
            USE_GRANIAN: 'true'
            GRANIAN_WORKERS: '4'
            OPT_OUT_CAPTURE: 'true'
            CLOUD_DEPLOYMENT: ''
            TEMPORAL_HOST: temporal
            TEMPORAL_PORT: 7233
            TEMPORAL_NAMESPACE: default
            CLICKHOUSE_HOST: clickhouse
            CLICKHOUSE_PORT: 9000
            CLICKHOUSE_DATABASE: posthog
            CLICKHOUSE_USER: default
            CLICKHOUSE_PASSWORD: ""
            CLICKHOUSE_SECURE: "false"
            CLICKHOUSE_VERIFY: "false"
            OPENAI_API_KEY: ${OPENAI_API_KEY}
            OPENAI_BASE_URL: https://new-api.lingowhale.com/v1
            EMAIL_HOST: ${EMAIL_HOST}
            EMAIL_PORT: ${EMAIL_PORT}
            EMAIL_HOST_USER: ${EMAIL_HOST_USER}
            EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD}
            EMAIL_USE_SSL: ${EMAIL_USE_SSL}
            EMAIL_USE_TLS: ${EMAIL_USE_TLS}
            DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL}
            EMAIL_ENABLED: ${EMAIL_ENABLED}
        depends_on:
            - db
            - redis
            - clickhouse
            - kafka
            - objectstorage
            - seaweedfs
            - temporal

    plugins:
        extends:
            file: docker-compose.base.yml
            service: plugins
        image: $REGISTRY_URL:$POSTHOG_APP_TAG
        pull_policy: if_not_present
        environment:
            SITE_URL: https://$DOMAIN
            SECRET_KEY: $POSTHOG_SECRET
            OBJECT_STORAGE_ACCESS_KEY_ID: 'object_storage_root_user'
            OBJECT_STORAGE_SECRET_ACCESS_KEY: 'object_storage_root_password'
            SESSION_RECORDING_V2_S3_ACCESS_KEY_ID: 'any'
            SESSION_RECORDING_V2_S3_SECRET_ACCESS_KEY: 'any'
            SESSION_RECORDING_V2_S3_TIMEOUT_MS: 120000
            OBJECT_STORAGE_ENDPOINT: http://objectstorage:19000
            SESSION_RECORDING_V2_S3_ENDPOINT: http://seaweedfs:8333
            OBJECT_STORAGE_ENABLED: true
            CDP_REDIS_HOST: redis7
            CDP_REDIS_PORT: 6379
            LOGS_REDIS_HOST: redis7
            LOGS_REDIS_PORT: 6379
            LOGS_REDIS_TLS: 'false'
            ENCRYPTION_SALT_KEYS: $ENCRYPTION_SALT_KEYS
            CYCLOTRON_DATABASE_URL: 'postgres://posthog:posthog@db:5432/posthog'
            PERSONS_DATABASE_URL: 'postgres://posthog:posthog@db:5432/posthog'
            BEHAVIORAL_COHORTS_DATABASE_URL: 'postgres://posthog:posthog@db:5432/posthog'
            OTEL_EXPORTER_OTLP_ENDPOINT: ''
            TEMPORAL_HOST: temporal 
            TEMPORAL_PORT: 7233
            TEMPORAL_NAMESPACE: default
            CLICKHOUSE_HOST: clickhouse
            CLICKHOUSE_PORT: 9000
            CLICKHOUSE_DATABASE: posthog
            CLICKHOUSE_USER: default
            CLICKHOUSE_PASSWORD: ""
            CLICKHOUSE_SECURE: "false"
            CLICKHOUSE_VERIFY: "false"
        depends_on:
            - db
            - redis
            - redis7
            - clickhouse
            - kafka
            - objectstorage
            - seaweedfs
            - temporal

    proxy:
        extends:
            file: docker-compose.base.yml
            service: proxy
        ports:
            - '8080:80'
            - '8443:443'
        volumes:
            - caddy-data:/data
            - caddy-config:/config
        environment:
            CADDY_TLS_BLOCK: $TLS_BLOCK
            CADDY_HOST: '$DOMAIN, http://, https://'
            CADDYFILE: |
                {
                    servers {
                        metrics
                    }
                ${CADDY_TLS_BLOCK:-}
                }
                ${CADDY_HOST:-http://localhost:8000} {
                    encode gzip

                    @replay-capture {
                        path /s
                        path /s/
                        path /s/*
                    }

                    @capture-ai {
                        path /i/v0/ai
                        path /i/v0/ai/
                        path /i/v0/ai/*
                    }

                    @capture {
                        path /e
                        path /e/
                        path /e/*
                        path /i/v0
                        path /i/v0/
                        path /i/v0/*
                        path /batch
                        path /batch/
                        path /batch/*
                        path /capture
                        path /capture/
                        path /capture/*
                    }

                    @capture-logs {
                        path /i/v1/logs
                        path /i/v1/logs/
                        path /i/v1/logs/*
                    }

                    @flags {
                        path /flags
                        path /flags/
                        path /flags/*
                    }

                    @webhooks {
                        path /public/webhooks
                        path /public/webhooks/
                        path /public/webhooks/*
                        path /public/m/
                        path /public/m/*
                    }

                    @livestream {
                        path /livestream
                        path /livestream/
                        path /livestream/*
                    }

                    handle @livestream {
                        uri strip_prefix /livestream
                        reverse_proxy livestream:8080 {
                            flush_interval -1
                        }
                    }

                    handle @capture-ai {
                        reverse_proxy capture-ai:3000
                    }

                    handle @capture {
                        reverse_proxy capture:3000
                    }

                    handle @replay-capture {
                        reverse_proxy replay-capture:3000
                    }

                    handle @capture-logs {
                        reverse_proxy capture-logs:4318
                    }

                    handle @flags {
                        reverse_proxy feature-flags:3001
                    }

                    handle @webhooks {
                        reverse_proxy plugins:6738
                    }

                    handle /feishu-login* {
                        uri strip_prefix /feishu-login
                        reverse_proxy feishu-quick-login:5000
                    }

                    handle {
                        reverse_proxy web:8000
                    }
                }
        depends_on:
            - web
            - livestream
            - feishu-quick-login

    feishu-proxy:
        build: ./feishu-proxy
        profiles:
            - feishu
        ports:
            - '8910:8910'
        volumes:
            - feishu-proxy-data:/app
        depends_on:
            - web
        restart: unless-stopped

    feishu-quick-login:
        build: ./feishu-quick-login
        container_name: posthog-feishu-quick-login
        restart: unless-stopped
        environment:
            - FEISHU_APP_ID=${FEISHU_APP_ID}
            - FEISHU_APP_SECRET=${FEISHU_APP_SECRET}
            - POSTHOG_URL=http://web:8000
            - POSTHOG_EXTERNAL_URL=https://${DOMAIN}
            - REDIRECT_URI=https://${DOMAIN}/feishu-login/callback
        volumes:
            - ./feishu-quick-login/users.json:/app/users.json:ro

    objectstorage:
        extends:
            file: docker-compose.base.yml
            service: objectstorage

        restart: on-failure
        volumes:
            - objectstorage:/data
        ports:
            - '19000:19000'
            - '19001:19001'

    seaweedfs:
        extends:
            file: docker-compose.base.yml
            service: seaweedfs
        restart: on-failure
        volumes:
            - seaweedfs:/data
        healthcheck:
            test:
                [
                    'CMD',
                    'sh',
                    '-c',
                    "echo 's3.bucket.list' | /usr/bin/weed shell -master=localhost:9333 2>&1 | grep -q posthog",
                ]
            interval: 5s
            timeout: 10s
            retries: 30
            start_period: 10s

    asyncmigrationscheck:
        extends:
            file: docker-compose.base.yml
            service: asyncmigrationscheck
        image: $REGISTRY_URL:$POSTHOG_APP_TAG
        environment:
            SITE_URL: https://$DOMAIN
            SECRET_KEY: $POSTHOG_SECRET
            SKIP_ASYNC_MIGRATIONS_SETUP: 0
            CLICKHOUSE_HOST: clickhouse
            CLICKHOUSE_PORT: 9000
            CLICKHOUSE_DATABASE: posthog
            CLICKHOUSE_USER: default
            CLICKHOUSE_PASSWORD: ""
            CLICKHOUSE_SECURE: "false"
            CLICKHOUSE_VERIFY: "false"

    # Temporal containers
    temporal:
        extends:
            file: docker-compose.base.yml
            service: temporal
        environment:
            - ENABLE_ES=false
        ports:
            - 7233:7233
        volumes:
            - ./posthog/docker/temporal/dynamicconfig:/etc/temporal/config/dynamicconfig
    elasticsearch:
        extends:
            file: docker-compose.base.yml
            service: elasticsearch
    temporal-admin-tools:
        extends:
            file: docker-compose.base.yml
            service: temporal-admin-tools
        depends_on:
            - temporal
    temporal-ui:
        extends:
            file: docker-compose.base.yml
            service: temporal-ui
        ports:
            - 8081:8080
        depends_on:
            temporal:
                condition: service_started
            db:
                condition: service_healthy
    temporal-django-worker:
        command: /compose/temporal-django-worker
        extends:
            file: docker-compose.base.yml
            service: temporal-django-worker
        volumes:
            - ./compose:/compose
            # - ./posthog:/code  # 注释：源码挂载可能与官方镜像版本不兼容
        image: $REGISTRY_URL:$POSTHOG_APP_TAG
        environment:
            SITE_URL: https://$DOMAIN
            SECRET_KEY: $POSTHOG_SECRET
            TEMPORAL_HOST: temporal
            TEMPORAL_PORT: 7233
            TEMPORAL_NAMESPACE: default
            CLICKHOUSE_HOST: clickhouse
            CLICKHOUSE_PORT: 9000
            CLICKHOUSE_DATABASE: posthog
            CLICKHOUSE_USER: default
            CLICKHOUSE_PASSWORD: ""
            CLICKHOUSE_SECURE: "false"
            CLICKHOUSE_VERIFY: "false"
            DATABASE_URL: 'postgres://posthog:posthog@db:5432/posthog'
            ENCRYPTION_SALT_KEYS: $ENCRYPTION_SALT_KEYS
            OBJECT_STORAGE_ENABLED: true
            OBJECT_STORAGE_ENDPOINT: http://objectstorage:19000
            OBJECT_STORAGE_ACCESS_KEY_ID: 'object_storage_root_user'
            OBJECT_STORAGE_SECRET_ACCESS_KEY: 'object_storage_root_password'
            AWS_ACCESS_KEY_ID: object_storage_root_user
            AWS_SECRET_ACCESS_KEY: object_storage_root_password
            AWS_ENDPOINT_URL: http://objectstorage:19000
            AWS_REGION: us-east-1
            AWS_ALLOW_HTTP: "true"
            AWS_S3_ALLOW_UNSAFE_RENAME: "true"
        depends_on:
            - db
            - redis
            - clickhouse
            - kafka
            - objectstorage
            - seaweedfs
            - temporal
    temporal-django-worker-data-warehouse:
        command: /compose/temporal-django-worker --task-queue data-warehouse-task-queue
        extends:
            file: docker-compose.base.yml
            service: temporal-django-worker
        volumes:
            - ./compose:/compose
            # - ./posthog:/code  # 注释：源码挂载可能与官方镜像版本不兼容
        image: $REGISTRY_URL:$POSTHOG_APP_TAG
        environment:
            SITE_URL: https://$DOMAIN
            SECRET_KEY: $POSTHOG_SECRET
            TEMPORAL_TASK_QUEUE: data-warehouse-task-queue
            TEMPORAL_HOST: temporal
            TEMPORAL_PORT: 7233
            TEMPORAL_NAMESPACE: default
            CLICKHOUSE_HOST: clickhouse
            CLICKHOUSE_PORT: 9000
            CLICKHOUSE_DATABASE: posthog
            CLICKHOUSE_USER: default
            CLICKHOUSE_PASSWORD: ""
            CLICKHOUSE_SECURE: "false"
            CLICKHOUSE_VERIFY: "false"
            DATABASE_URL: 'postgres://posthog:posthog@db:5432/posthog'
            ENCRYPTION_SALT_KEYS: $ENCRYPTION_SALT_KEYS
            OBJECT_STORAGE_ENABLED: true
            OBJECT_STORAGE_ENDPOINT: http://objectstorage:19000
            OBJECT_STORAGE_ACCESS_KEY_ID: 'object_storage_root_user'
            OBJECT_STORAGE_SECRET_ACCESS_KEY: 'object_storage_root_password'
            DATA_WAREHOUSE_REDIS_HOST: redis7
            DATA_WAREHOUSE_REDIS_PORT: 6379
            AWS_ACCESS_KEY_ID: object_storage_root_user
            AWS_SECRET_ACCESS_KEY: object_storage_root_password
            AWS_ENDPOINT_URL: http://objectstorage:19000
            AWS_REGION: us-east-1
            AWS_ALLOW_HTTP: "true"
            AWS_S3_ALLOW_UNSAFE_RENAME: "true"

        depends_on:
            - db
            - redis
            - clickhouse
            - kafka
            - objectstorage
            - seaweedfs
            - temporal


    temporal-django-worker-max-ai:
        command: /compose/temporal-django-worker --task-queue max-ai-task-queue
        extends:
            file: docker-compose.base.yml
            service: temporal-django-worker
        volumes:
            - ./compose:/compose
            # - ./posthog:/code  # 注释：源码挂载可能与官方镜像版本不兼容
        image: $REGISTRY_URL:$POSTHOG_APP_TAG
        environment:
            SITE_URL: https://$DOMAIN
            SECRET_KEY: $POSTHOG_SECRET
            TEMPORAL_TASK_QUEUE: max-ai-task-queue
            TEMPORAL_HOST: temporal
            TEMPORAL_PORT: 7233
            TEMPORAL_NAMESPACE: default
            CLICKHOUSE_HOST: clickhouse
            CLICKHOUSE_PORT: 9000
            CLICKHOUSE_DATABASE: posthog
            CLICKHOUSE_USER: default
            CLICKHOUSE_PASSWORD: ""
            CLICKHOUSE_SECURE: "false"
            CLICKHOUSE_VERIFY: "false"
            DATABASE_URL: 'postgres://posthog:posthog@db:5432/posthog'
            ENCRYPTION_SALT_KEYS: $ENCRYPTION_SALT_KEYS
            OBJECT_STORAGE_ENABLED: true
            OBJECT_STORAGE_ENDPOINT: http://objectstorage:19000
            OBJECT_STORAGE_ACCESS_KEY_ID: 'object_storage_root_user'
            OBJECT_STORAGE_SECRET_ACCESS_KEY: 'object_storage_root_password'
            OPENAI_API_KEY: ${OPENAI_API_KEY}
            OPENAI_BASE_URL: https://new-api.lingowhale.com/v1
            ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
            ANTHROPIC_BASE_URL: https://new-api.lingowhale.com
            AWS_ACCESS_KEY_ID: object_storage_root_user
            AWS_SECRET_ACCESS_KEY: object_storage_root_password
            AWS_ENDPOINT_URL: http://objectstorage:19000
            AWS_REGION: us-east-1
            AWS_ALLOW_HTTP: "true"
            AWS_S3_ALLOW_UNSAFE_RENAME: "true"
        depends_on:
            - db
            - redis
            - clickhouse
            - kafka
            - objectstorage
            - seaweedfs
            - temporal

    cyclotron-janitor:
        extends:
            file: docker-compose.base.yml
            service: cyclotron-janitor
        build:
            context: ./posthog/rust
        environment:
            DATABASE_URL: 'postgres://posthog:posthog@db:5432/posthog'
            KAFKA_HOSTS: 'kafka:9092'
        depends_on:
            db:
                condition: service_healthy
            kafka:
                condition: service_started

    capture:
        build:
            context: ./posthog/rust
        extends:
            file: docker-compose.base.yml
            service: capture

    replay-capture:
        build:
            context: ./posthog/rust
        extends:
            file: docker-compose.base.yml
            service: replay-capture

    property-defs-rs:
        build:
            context: ./posthog/rust
        extends:
            file: docker-compose.base.yml
            service: property-defs-rs
        depends_on:
            kafka-init:
                condition: service_completed_successfully
            db:
                condition: service_healthy

    livestream:
        extends:
            file: docker-compose.base.yml
            service: livestream
        environment:
            - LIVESTREAM_JWT_SECRET=${POSTHOG_SECRET}
            - LIVESTREAM_MMDB_PATH=GeoLite2-City.mmdb
            - LIVESTREAM_CONSUMERS_EVENT_BROKERS=kafka:9092
            - LIVESTREAM_CONSUMERS_EVENT_TOPIC=events_plugin_ingestion
            - LIVESTREAM_CONSUMERS_EVENT_SECURITY_PROTOCOL=PLAINTEXT
            - LIVESTREAM_CONSUMERS_EVENT_GROUP_ID=livestream
            - LIVESTREAM_CONSUMERS_SESSION_RECORDING_BROKERS=kafka:9092
            - LIVESTREAM_CONSUMERS_SESSION_RECORDING_TOPIC=session_recording_snapshot_item_events
            - LIVESTREAM_CONSUMERS_SESSION_RECORDING_SECURITY_PROTOCOL=PLAINTEXT
            - LIVESTREAM_CONSUMERS_SESSION_RECORDING_GROUP_ID=livestream-session-recording

    feature-flags:
        build:
            context: ./posthog/rust
        extends:
            file: docker-compose.base.yml
            service: feature-flags
        depends_on:
            - db
            - redis

    kafka-init:
        image: docker.redpanda.com/redpandadata/redpanda:v25.1.9
        entrypoint: /bin/sh
        command:
            - -c
            - |
                set -x
                echo "Waiting for Kafka broker to accept connections..."
                TIMEOUT=60
                ELAPSED=0
                # Use rpk topic list as the readiness check - it's a simple operation
                # that confirms the broker is accepting Kafka protocol requests
                until rpk topic list --brokers kafka:9092 2>/dev/null; do
                    echo "Kafka broker not ready yet (elapsed: ${ELAPSED}s)..."
                    sleep 2
                    ELAPSED=$((ELAPSED + 2))
                    if [ $ELAPSED -ge $TIMEOUT ]; then
                        echo "Timeout waiting for Kafka broker after ${TIMEOUT}s"
                        echo "Final attempt to list topics:"
                        rpk topic list --brokers kafka:9092 || true
                        exit 1
                    fi
                done
                echo "Kafka broker is accepting requests, creating topics..."
                # Create topics needed by rust services
                # Note: $$ escapes $ for docker-compose variable substitution
                for topic in exceptions_ingestion clickhouse_events_json; do
                    if rpk topic create "$$topic" --brokers kafka:9092 -p 1 -r 1 2>&1; then
                        echo "Topic $$topic created successfully"
                    else
                        if rpk topic list --brokers kafka:9092 | grep -q "$$topic"; then
                            echo "Topic $$topic already exists, continuing"
                        else
                            echo "Failed to create topic $$topic"
                            exit 1
                        fi
                    fi
                done
                echo "Final topic list:"
                rpk topic list --brokers kafka:9092
                echo "Topics ready"
        depends_on:
            kafka:
                condition: service_healthy

    cymbal:
        image: ghcr.io/posthog/posthog/cymbal:master
        build:
            context: ./posthog/rust
            args:
                BIN: cymbal
        restart: on-failure
        volumes:
            - ./share:/share
        environment:
            KAFKA_HOSTS: 'kafka:9092'
            KAFKA_CONSUMER_GROUP: cymbal
