services:
  prometheus:
    image: prom/prometheus:latest
    container_name: posthog-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ./alerts.yml:/etc/prometheus/alerts.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=7d'
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - posthog_default

  grafana:
    image: grafana/grafana:latest
    container_name: posthog-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_INSTALL_PLUGINS=grafana-clickhouse-datasource
      - GF_DEFAULT_LANGUAGE=zh-Hans
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - posthog_default

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: posthog-cadvisor
    restart: unless-stopped
    command:
      - '--port=8082'
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    privileged: true
    devices:
      - /dev/kmsg
    network_mode: host

  kafka-exporter:
    image: danielqsj/kafka-exporter:latest
    container_name: posthog-kafka-exporter
    restart: unless-stopped
    ports:
      - "9308:9308"
    command:
      - '--kafka.server=posthog-kafka-1:9092'
    networks:
      - posthog_default

  node-exporter:
    image: prom/node-exporter:latest
    container_name: posthog-node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    network_mode: host

  clickhouse-exporter:
    image: f1yegor/clickhouse-exporter:latest
    container_name: posthog-clickhouse-exporter
    restart: unless-stopped
    ports:
      - "9116:9116"
    command:
      - '-scrape_uri=http://posthog-clickhouse-1:8123/'
    networks:
      - posthog_default

  alertmanager:
    image: prom/alertmanager:latest
    container_name: posthog-alertmanager
    restart: unless-stopped
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml
      - alertmanager-data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    networks:
      - posthog_default

  feishu-alert-adapter:
    build: ./feishu-alert-adapter
    container_name: posthog-feishu-adapter
    restart: unless-stopped
    networks:
      - posthog_default

volumes:
  prometheus-data:
  grafana-data:
  alertmanager-data:

networks:
  posthog_default:
    external: true
