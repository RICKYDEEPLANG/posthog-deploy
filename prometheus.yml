global:
  scrape_interval: 15s

rule_files:
  - 'alerts.yml'

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'containers'
    static_configs:
      - targets: ['host.docker.internal:8082']

  - job_name: 'kafka'
    static_configs:
      - targets: ['posthog-kafka-exporter:9308']

  - job_name: 'system'
    static_configs:
      - targets: ['host.docker.internal:9100']

  - job_name: 'clickhouse'
    static_configs:
      - targets: ['posthog-clickhouse-exporter:9116']
