version: '3.8'

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: posthog-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=7d'
    network_mode: host

  grafana:
    image: grafana/grafana:latest
    container_name: posthog-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin123
    volumes:
      - grafana-data:/var/lib/grafana
    network_mode: host

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: posthog-cadvisor
    restart: unless-stopped
    ports:
      - "8082:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    privileged: true
    network_mode: host

  kafka-exporter:
    image: danielqsj/kafka-exporter:latest
    container_name: posthog-kafka-exporter
    restart: unless-stopped
    ports:
      - "9308:9308"
    command:
      - '--kafka.server=localhost:9092'
    network_mode: host

  node-exporter:
    image: prom/node-exporter:latest
    container_name: posthog-node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    network_mode: host

  clickhouse-exporter:
    image: clickhouse/clickhouse-exporter:latest
    container_name: posthog-clickhouse-exporter
    restart: unless-stopped
    ports:
      - "9116:9116"
    environment:
      - CLICKHOUSE_HOST=localhost
      - CLICKHOUSE_PORT=9000
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=
    network_mode: host

volumes:
  prometheus-data:
  grafana-data:
